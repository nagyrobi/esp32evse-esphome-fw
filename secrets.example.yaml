# Copy to secrets.yaml (next to your device configuration) and fill in.
wifi_ssid: "my-wifi"
wifi_password: "my-wifi-password"
# fallback hotspot when the WiFi is not reachable (min. 8 characters)
fallback_ap_password: "my-fallback-password"
# 32 random bytes, base64 encoded, e.g. generated by: openssl rand -base64 32
api_encryption_key: "REPLACE-WITH-A-BASE64-KEY"
